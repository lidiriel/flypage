<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#62a0ea" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3584e4" stop-opacity="0.6"/>
    </linearGradient>
    <clipPath id="sheet">
      <path d="M44 14h40l20 20v76a6 6 0 0 1-6 6H44a6 6 0 0 1-6-6V20a6 6 0 0 1 6-6z"/>
    </clipPath>
  </defs>
  <!-- motion lines: the page flies in from the scanner -->
  <g fill="#3584e4" stroke="none">
    <rect x="6" y="40" width="24" height="6" rx="3"/>
    <rect x="12" y="58" width="18" height="6" rx="3" opacity="0.75"/>
    <rect x="18" y="76" width="12" height="6" rx="3" opacity="0.5"/>
  </g>
  <g transform="rotate(-6 70 66)">
    <!-- shadow -->
    <path d="M46 18h40l20 20v76a6 6 0 0 1-6 6H46a6 6 0 0 1-6-6V24a6 6 0 0 1 6-6z" fill="#000" opacity="0.18"/>
    <!-- page -->
    <path d="M44 14h40l20 20v76a6 6 0 0 1-6 6H44a6 6 0 0 1-6-6V20a6 6 0 0 1 6-6z" fill="#fafafa" stroke="#c0bfbc" stroke-width="2"/>
    <g clip-path="url(#sheet)">
      <!-- part already scanned: text recognised (dark) -->
      <rect x="38" y="14" width="66" height="54" fill="url(#beam)"/>
      <g fill="#241f31">
        <rect x="48" y="40" width="40" height="5" rx="2.5"/>
        <rect x="48" y="52" width="46" height="5" rx="2.5"/>
      </g>
      <!-- not scanned yet: grey lines -->
      <g fill="#c0bfbc">
        <rect x="48" y="76" width="46" height="5" rx="2.5"/>
        <rect x="48" y="88" width="36" height="5" rx="2.5"/>
        <rect x="48" y="100" width="42" height="5" rx="2.5"/>
      </g>
      <!-- scan beam -->
      <rect x="30" y="65" width="80" height="4" fill="#1c71d8"/>
    </g>
    <!-- folded corner -->
    <path d="M84 14v14a6 6 0 0 0 6 6h14z" fill="#deddda" stroke="#c0bfbc" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
